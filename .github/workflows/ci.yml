# CI pipeline for the Nextgamenight BACKEND repo (chrismcclarin/nextgamenight-backend).
#
# REPO-TOPOLOGY (REVIEW R4 HIGH): the git repo ROOT is this directory
# (periodictabletopbackend_v2/); the Express app lives in the `Sonnet/` SUBDIRECTORY.
# GitHub Actions ONLY reads `.github/workflows/` at the repo ROOT — a workflow placed
# under `Sonnet/.github/workflows/` is INVISIBLE and never runs (a silent false-green
# that would disable the entire D-06 gate, both grep backstops, and the required-status
# branch protection). Therefore this file lives at the repo root, and every app-touching
# step sets `working-directory: Sonnet` with `cache-dependency-path: Sonnet/package-lock.json`.
#
# Three jobs (D-06 / BSEC-02):
#   quality  — fast gate: install + six inverted grep backstops (D-01 / D-05 / BE-043,
#              the two 83.1 test-hygiene gates, and the 88.2 F-02 paranoid-destroy gate),
#              TWO presence gates that fail on an ABSENT string rather than a present one
#              (88.2 SPEC-REQ-10, the purge sweep's explicit child deletes; and 88.4
#              SPEC R6, a DECISION marker on every schema-drift allowlist entry), plus the
#              D-04 skip-count ratchet
#   test     — slow gate (needs: quality): Jest/supertest against a Postgres service container
#   migrate-cli-replay — slow gate (needs: quality): the real sequelize-cli migration path
#              replayed from an EMPTY database, diffed against a sequelize.sync() build of
#              the same commit's models (88.4). See its own header comment below.
name: CI

on:
  pull_request:
    branches: [main] # the BE repo's default branch (NOT the docs-root `master`)
  push:
    branches-ignore: [main]

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Sonnet/package-lock.json # lockfile lives in the subdir

      - name: Install dependencies
        working-directory: Sonnet
        run: npm ci

      # ---- D-06 grep backstops --------------------------------------------------
      # grep returns nonzero on NO MATCH (Pitfall 2), so capture with `|| true`, test
      # for non-empty, and `exit 1` on match. Patterns are scoped NARROWLY (Pitfall 3)
      # so they do NOT trip the ~25 legit `where: { user_id: req.params.user_id }`
      # route-param lookups (those derive the actor separately from the verified JWT).

      - name: "Grep gate — client-supplied id as DB authz subject (D-01 backstop / BSEC-01)"
        working-directory: Sonnet
        # Matches `where: { user_id: req.query.user_id }` / `req.body.user_id` — a
        # CLIENT-CONTROLLED id used as the authz FILTER. Deliberately EXCLUDES
        # `req.params.user_id`: that is route-positional (e.g. GET /users/:user_id),
        # used legitimately for lookups across events.js/users.js/userGames.js, and
        # is NOT the spoofable authz-subject class D-01 targets.
        run: |
          HITS=$(grep -rnE 'where:\s*\{\s*user_id:\s*req\.(query|body)\.user_id' routes/ || true)
          if [ -n "$HITS" ]; then
            echo "::error::Client-supplied id (req.query/req.body.user_id) used as a DB authz subject — derive the actor from the verified JWT (req.user.user_id) instead (D-01 / BSEC-01):"
            echo "$HITS"
            exit 1
          fi
          echo "D-01 backstop passed — no client-supplied id used as an authz subject."

      - name: "Grep gate — invite_token leaked via findByPk (BE-043 / BSEC-01)"
        working-directory: Sonnet
        # Matches a findByPk(...) call that explicitly pulls back `invite_token`
        # (the Group invite-token leak). The durable fix is a Group defaultScope
        # excluding invite_token (83-05); this backstop catches a re-leak.
        run: |
          HITS=$(grep -rnE 'findByPk[^)]*invite_token' routes/ || true)
          if [ -n "$HITS" ]; then
            echo "::error::findByPk(...) returning invite_token — the invite token must not be selected into a roster/preview read (BE-043 / BSEC-01):"
            echo "$HITS"
            exit 1
          fi
          echo "BE-043 backstop passed — no findByPk returning invite_token."

      - name: "Grep gate — mass-assignment via ...req.body (D-05 backstop / BSEC-01)"
        working-directory: Sonnet
        # Matches the `...req.body` spread that flows into Sequelize .create()/.update()
        # sinks (mass-assignment). KNOWN PENDING: routes/games.js (POST / create) and
        # routes/groupPromptSettings.js (JSONB schedule merge) still spread ...req.body
        # and are fixed by later plans in THIS phase (D-05C) — until they land, this
        # gate is RED on this branch by design (it IS the backstop catching the holes).
        run: |
          HITS=$(grep -rnE '\.\.\.req\.body' routes/ || true)
          if [ -n "$HITS" ]; then
            echo "::error::...req.body spread into a write sink (mass-assignment) — use an explicit Sequelize fields:[] allow-list / key allow-list instead (D-05 / BSEC-01):"
            echo "$HITS"
            exit 1
          fi
          echo "D-05 backstop passed — no ...req.body mass-assignment spread."

      # ---- 83.1 structural test-hygiene gates (D-01 / D-04 / BTEST-01/02) -------
      # These enforce the de-poisoned green state from Phase 83.1: no test may
      # re-introduce a destructive force-sync or a stray sequelize.close(), and the
      # skip count may only DECREASE (the milestone ratchet to zero). They EXCLUDE
      # the two legitimate harness files (tests/globalSetup.js owns the one-time
      # schema sync({force}) + its parent-process close; tests/globalTeardown.js
      # owns the connection lifecycle close) and FILTER comment lines, so they do
      # not self-flag the harness or their own explanatory prose.

      - name: "Grep gate — destructive force-sync in tests (D-01 / BTEST-01)"
        working-directory: Sonnet
        # Fail if any tests/ file OTHER THAN globalSetup.js contains an uncommented
        # sequelize.sync({force...}) (with or without the space after `{`). globalSetup.js
        # is the ONE legitimate one-time schema build (parent process, guarded) and is
        # excluded — mirroring its close-gate exclusion below.
        run: |
          HITS=$(grep -rnE --include='*.js' 'sync\(\{ ?force' tests/ | grep -v 'tests/globalSetup.js' | grep -vE '^[^:]+:[0-9]+:\s*//' || true)
          if [ -n "$HITS" ]; then
            echo "::error::Destructive sequelize.sync({force}) in a test file (drops every table) — the schema is built ONCE in tests/globalSetup.js; per-test isolation is the global beforeEach TRUNCATE (D-01 / BTEST-01):"
            echo "$HITS"
            exit 1
          fi
          echo "Force-sync gate passed — no destructive force-sync outside globalSetup.js."

      - name: "Grep gate — force-less destroy on a paranoid model (88.2 / F-02)"
        working-directory: Sonnet
        # Phase 88.2 made Group, UserGroup and Event `paranoid: true` (D-01). From that
        # point on, `Model.destroy(...)` is an `UPDATE "deletedAt" = now()` rather than a
        # DELETE whenever the model is paranoid and `options.force` is not set
        # (sequelize/lib/model.js:1826-1838). Every hard delete that must STAY hard
        # therefore has to say so explicitly. This gate keeps it that way.
        #
        # Two-stage LINE pipeline: match the call, then drop the sanctioned lines.
        #   scope  — routes/ services/ workers/ scripts/ middleware/ queues/, *.js only.
        #            tests/ is excluded on purpose (fixtures legitimately clean up) and
        #            so is models/ (the paranoid flag itself lives there).
        #   match  — the three paranoid model CLASSES plus the four instance-variable
        #            names those models are bound to in this codebase. The literal `.`
        #            straight after the identifier means EventParticipation.destroy,
        #            EventRsvp.destroy, GroupInvite.destroy and GroupPromptSettings.destroy
        #            do NOT match — correct, none of those models is paranoid.
        #   filter — comment lines, then `force: true` specifically.
        #
        # KNOWN AND ACCEPTED LIMITATIONS (these are named, not oversights):
        #  1. LINE-SCOPED. A `force: true` sitting on a DIFFERENT line from the
        #     `.destroy(` is invisible to stage 2, so a multi-line call is reported as a
        #     hit even when it is correctly forced (routes/invites.js is the one such
        #     site, and it carries the flag on the call line for exactly this reason).
        #     The correct response to a false positive is to REFORMAT THE CALL. Never
        #     loosen the pattern — widening a data-retention control to accommodate
        #     formatting is how it stops catching the thing it exists for.
        #  2. FIXED INSTANCE-NAME ALLOWLIST. `group|userGroup|event|targetUserGroup` is
        #     four identifiers, so a future `membership.destroy()`, `ug.destroy()` or
        #     `g.destroy()` on a paranoid model is invisible here. Do NOT "fix" this by
        #     broadening stage 1 to any `.destroy(` — that matches the dozens of
        #     legitimate non-paranoid destroys and the resulting noise gets the gate
        #     weakened or deleted. New instance-variable destroys on Group/UserGroup/Event
        #     must use one of the allowlisted names, or be added to the list.
        #  3. NO line-number exclusions, ever. A line-number filter is a blind spot with
        #     an expiry date nobody sets — the code under those lines moves and the filter
        #     silently starts skipping something else.
        #
        # The regex below is kept BYTE-FOR-BYTE in sync with PATTERNS.forcelessParanoidDestroy
        # in tests/routes/ci-grep-gate.fixture.test.js, which self-tests this whole
        # two-stage pipeline (not just the regex) against fixtures.
        run: |
          HITS=$(grep -rnE --include='*.js' '\b(Group|UserGroup|Event|group|userGroup|event|targetUserGroup)\.destroy\(' routes/ services/ workers/ scripts/ middleware/ queues/ | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*)' | grep -vE 'force:[[:space:]]*true' || true)
          if [ -n "$HITS" ]; then
            echo "::error::destroy() on Group, UserGroup or Event WITHOUT force: true — those three models are paranoid (88.2 / D-01), so this is now a SOFT delete (UPDATE deletedAt), not a DELETE (sequelize/lib/model.js:1826-1838). If the row must really be removed, add force: true ON THE .destroy( LINE (this gate is line-scoped). If it is a deliberate soft delete, route it through the group soft-delete path rather than calling destroy. Known gap: the instance-name allowlist is exactly group|userGroup|event|targetUserGroup — an aliased name is NOT checked by this gate."
            echo "$HITS"
            exit 1
          fi
          echo "F-02 gate passed — no force-less destroy on Group/UserGroup/Event."

      - name: "Grep gate — purge sweep must delete GroupInvite + SingleUseToken explicitly (88.2 / SPEC-REQ-10)"
        working-directory: Sonnet
        # INVERTED RELATIVE TO EVERY OTHER GATE HERE: this one fails when a REQUIRED
        # string is ABSENT, not when a forbidden one is present. It pins the two
        # explicit child deletes in services/groupPurgeSweep.js that no integration
        # test in this repo can honestly verify.
        #
        # WHY A GATE AND NOT A TEST. The CI database is built by sequelize.sync()
        # (see the `test` job's "NO migrate step (A5)" note), and Sequelize's
        # `belongsTo` puts ON DELETE CASCADE on every NOT NULL foreign key. So the CI
        # database cascades those rows away on its own, and an integration assertion
        # reading "no invite rows remain after one sweep" passes whether or not the
        # explicit delete exists. A contributor could delete the line as redundant,
        # watch CI go green, and ship a weaker purge. THIS gate is the control.
        #
        # Those rows carry invitee email PII and the delete must not depend on a
        # cascade whose production disposition is unconfirmed. The live,
        # per-environment FK dispositions are recorded in
        # .planning/.../88.2-CASCADE-AUDIT.md in the planning repo — the environments
        # measured DISAGREE, which is exactly why the explicit delete exists.
        #
        # Comment lines are filtered before counting so a mention in prose cannot
        # satisfy the gate.
        run: |
          FILE=services/groupPurgeSweep.js
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE is missing — SPEC-REQ-10's purge sweep must exist and must delete GroupInvite + SingleUseToken rows explicitly."
            exit 1
          fi
          INVITES=$(grep -nE 'GroupInvite\.destroy' "$FILE" | grep -vE '^[0-9]+:[[:space:]]*(//|\*)' | wc -l | tr -d ' ')
          TOKENS=$(grep -nE 'SingleUseToken\.destroy' "$FILE" | grep -vE '^[0-9]+:[[:space:]]*(//|\*)' | wc -l | tr -d ' ')
          echo "purge-sweep explicit deletes: GroupInvite=$INVITES SingleUseToken=$TOKENS"
          if [ "$INVITES" -eq 0 ] || [ "$TOKENS" -eq 0 ]; then
            echo "::error::$FILE must delete GroupInvite AND SingleUseToken rows EXPLICITLY (SPEC-REQ-10 / 88.2 D-05). These lines are NOT redundant with the foreign keys: the CI database is sequelize.sync()-built, and Sequelize's belongsTo adds ON DELETE CASCADE to every NOT NULL group_id — so the integration test asserting those rows are gone passes whether or not this code exists, and CANNOT be the control. Invite rows carry invitee email PII; the delete must not depend on a cascade whose production disposition is unconfirmed (the environments measured in 88.2-CASCADE-AUDIT.md disagree). If you are deliberately removing this, change the gate and say why in the same commit."
            exit 1
          fi
          echo "SPEC-REQ-10 purge-delete gate passed — both explicit deletes present."

      - name: "Grep gate — every schema-drift allowlist entry carries a DECISION Phase 88.4 marker (88.4 / SPEC R6)"
        working-directory: Sonnet
        # PRESENCE gate, like the SPEC-REQ-10 one above (and unlike the six inverted
        # backstops): it fails when a REQUIRED string is ABSENT.
        #
        # scripts/ci/schema-drift-allowlist.js is the ONLY way a migrate-cli-replay drift
        # finding gets suppressed. D-07 / SPEC R6 therefore require a full
        # `DECISION Phase 88.4 <accepted> OVER <rejected> — <why>` block on EVERY entry: an
        # entry with no rationale is accepted schema drift with nobody's reasoning attached,
        # and it reads in review as though the drift WAS reviewed, so the next reader stops
        # looking. This gate lives in `quality` (not in migrate-cli-replay) so the failure is
        # 30 seconds into the run and needs no database.
        #
        # PER-ENTRY PAIRING IS NOW ENFORCED STRUCTURALLY, not implied by a total
        # (88.4-CODE-REVIEW.md #3 + #10). This step used to compare ENTRIES.length against an
        # anchored `grep -c` of marker lines and fail only when markers < entries, conceding in
        # its own comment that pairing was "enforced upstream by the allowlist module's own
        # header" — i.e. by a comment. Three malformed files passed it: an unmarked entry masked
        # by a duplicated token on a sibling's block; an orphaned block left behind when an entry
        # was deleted (markers > entries passed silently); and markers stacked against the wrong
        # entries. SPEC R6's acceptance is a PER-ENTRY property and two totals cannot express one.
        #
        # scripts/ci/verify-allowlist-markers.js walks the ENTRIES array with a bracket+brace
        # scanner and asserts three things independently — every entry is immediately preceded by
        # its own marker run, no marker is orphaned, and the counts agree. It lives in a committed
        # script rather than inline here so it is UNIT-TESTED
        # (tests/unit/verify-allowlist-markers.test.js, 16 cases incl. all three files that used
        # to slip through): a gate whose job is catching sloppy edits to a security-relevant
        # policy file must not itself be an unverifiable one-liner.
        #
        # It also runs validateAllowlist separately below. That is NOT belt-and-braces: the
        # allowlist module does NOT validate itself at load — schema-drift-diff.js:73-80 is what
        # calls the validator — so without that line a malformed policy file sails through the
        # fast job and only throws minutes later inside migrate-cli-replay, where it reads as a
        # differ crash rather than as the policy typo it is. Safe in this fast job: the module
        # opens no DB connection and pulls in no models (88.4-04).
        run: |
          FILE=scripts/ci/schema-drift-allowlist.js
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE is missing. scripts/ci/schema-drift-diff.js require()s it, so its absence fails the migrate-cli-replay job in a far less obvious place. Restore it — an EMPTY ENTRIES array is the correct day-one state (D-08), so there is no reason to delete the file."
            exit 1
          fi
          if ! node -e "const m = require('./scripts/ci/schema-drift-allowlist.js'); m.validateAllowlist(m.ENTRIES); console.log('validateAllowlist OK — ' + m.ENTRIES.length + ' entr(y/ies)')"; then
            echo "::error::$FILE failed to load or failed its own validator (see the thrown message above). validateAllowlist THROWS on any entry shape it does not fully understand (T-88.4-13) — a malformed accepted-drift policy is a crash, not a finding. Every entry must also pin the FULL normalized identity for its kind (PIN_FIELDS), not just keySpec + predicate: a partial pin suppresses objects nobody reviewed. Fix the entry it names; scripts/ci/schema-drift-diff.js calls the same validator at require time, so migrate-cli-replay cannot run until this loads clean."
            exit 1
          fi
          node scripts/ci/verify-allowlist-markers.js "$FILE"

      - name: "Grep gate — stray sequelize.close() in tests (D-01 / BTEST-02)"
        working-directory: Sonnet
        # Fail if any tests/ file OTHER THAN the two harness files contains an
        # uncommented sequelize.close(). BOTH globalSetup.js (closes its own
        # parent-process connection after the schema build) and globalTeardown.js
        # (defensively closes any straggler) legitimately close the connection and
        # live under tests/, so they MUST be excluded — otherwise this gate reds the
        # quality job and, because `test` is `needs: quality`, blocks the test job
        # entirely (DoD impossible). Comment lines are filtered explicitly.
        run: |
          HITS=$(grep -rnE 'sequelize\.close' tests/ | grep -vE ':\s*//' | grep -vE 'tests/globalSetup\.js|tests/globalTeardown\.js' || true)
          if [ -n "$HITS" ]; then
            echo "::error::sequelize.close() in a test file kills the shared serial connection for every later test — connection lifecycle is owned solely by tests/globalSetup.js + tests/globalTeardown.js (D-01 / BTEST-02):"
            echo "$HITS"
            exit 1
          fi
          echo "Close gate passed — no stray sequelize.close() outside the harness."

      - name: "Skip-count ratchet — skips may only decrease (D-04)"
        working-directory: Sonnet
        # Count REAL skip tags (the `// SKIP(<plan>)` defer convention), NOT bare
        # `SKIP(` substrings, and fail if the current count EXCEEDS the committed
        # baseline. Skips only go DOWN — each future BE phase un-skips the tests
        # tagged for it; the count MUST hit 0 when v2.0 closes. The baseline lives
        # in tests/.skip-baseline (currently 5: the SKIP(87) lists deferrals owned
        # by Phase 87 Data Integrity).
        run: |
          BASELINE=$(cat tests/.skip-baseline)
          CURRENT=$(grep -rhoE '//\s*SKIP\(' tests/ | wc -l | tr -d ' ')
          echo "Skip ratchet: baseline=$BASELINE current=$CURRENT"
          if [ "$CURRENT" -gt "$BASELINE" ]; then
            echo "::error::Skip count rose from $BASELINE (tests/.skip-baseline) to $CURRENT. Skips only go down — un-skip a test or, if a NEW defer is unavoidable, tag it // SKIP(<owning-plan>) AND lower the baseline only when its owner lands. Current SKIP tags:"
            grep -rnE '//\s*SKIP\(' tests/
            exit 1
          fi
          echo "Skip ratchet passed — skip count ($CURRENT) is at or below baseline ($BASELINE)."

  test:
    name: test
    needs: quality # D-06: the Jest suite only runs after the fast grep gate is green
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: boardgame_db
        ports:
          - 5432:5432
        # Health-gate the container so DB steps never race the service coming up.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # BTEST-04 / D-03 part 2: throwaway Redis service for the real-Redis
      # integration ring (npm run test:integration). Mirrors the postgres pin +
      # health-gate above. Pinned to the official redis:7 tag (T-83.1-06 supply-chain
      # mitigation). Reachable only on localhost within the job; destroyed at job end.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # DB connection — BOTH forms, so create-database.js (DB_* vars) and the runtime
      # (DATABASE_URL) agree on the same Postgres service container.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: boardgame_db
      DATABASE_URL: postgres://postgres:password@localhost:5432/boardgame_db
      # Signs availability magic JWTs + RSVP HMAC links (services/magicTokenService,
      # routes/rsvp.js). Throwaway CI-only value — must merely exist for boot.
      MAGIC_TOKEN_SECRET: ci-throwaway-magic-token-secret-1f2e3d4c5b6a
      # BTEST-04 / D-03 part 2: the lazy BullMQ queue connections resolve REDIS_URL
      # to the redis:7 service container above. Only the integration ring actually
      # connects (npm test stays Redis-free via testPathIgnorePatterns).
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Sonnet/package-lock.json

      - name: Install dependencies
        working-directory: Sonnet
        run: npm ci

      # NO migrate step — and as of Phase 88.4 the reason is NOT that it cannot run.
      #
      # The original A5 rationale said "the earliest migration assumes the Users table already
      # exists and cannot run from an empty DB". That premise was REMOVED by Phase 88.4's guarded
      # baseline migration (migrations/00000000000000-baseline-pre-migration-schema.js): the chain
      # now replays from a genuinely empty database, and the migrate-cli-replay job further down
      # THIS FILE proves it on every run. Leaving the old wording in place would invite a future
      # reader to "fix" this job by adding a migrate step — undoing a deliberate boundary — or to
      # stop trusting this file's comments, which this codebase leans on heavily as decision records.
      #
      # DECISION Phase 88.4: this job stays SYNC-BUILT (db:create, then seed running
      # sequelize.sync({ alter: true })) OVER migrating it now that migrating is possible. That is
      # the 88.4 SPEC boundary, not inertia — "sync-built test DBs are exactly what this gate makes
      # safe". The suite's job is to test application behaviour against the models; the
      # migrate-cli-replay drift gate is what makes a sync-built schema trustworthy by proving it
      # is structurally equivalent to the migration-built one prod runs. Migrating here would
      # remove the very divergence the gate exists to observe. Switching this to migrate is a
      # decision, not a cleanup.
      - name: Create database
        working-directory: Sonnet
        run: npm run db:create

      - name: Seed (sync({alter:true}) builds the schema from the models)
        working-directory: Sonnet
        run: npm run seed

      # `npm test` is the unit+DB suite ONLY — Redis is NOT required here (the
      # integration ring is excluded via testPathIgnorePatterns in jest.config.js).
      - name: Jest / supertest suite
        working-directory: Sonnet
        run: npm test

      # BTEST-04 / D-03 part 2: the real-Redis integration ring (enqueue -> real
      # worker -> assert side-effect) runs as a SEPARATE invocation against the
      # redis:7 service. The test job is green only if BOTH this and `npm test` pass.
      - name: Integration ring (real-Redis queues)
        working-directory: Sonnet
        run: npm run test:integration

  # ---- migrate-cli-replay (Phase 88.4 D-05; extends Phase 87.1 review F8) -----
  # ADDITIVE job (does not alter `quality` or `test`). It is the ONLY place backend CI
  # runs the REAL sequelize-cli migration path: the `test` job builds its schema with
  # sequelize.sync() (see its "NO migrate step (A5)" note), so without this job the
  # Railway pre-deploy step would be the FIRST-EVER real CLI run of every migration.
  # Phase 88.4 additionally makes migration-vs-model DRIFT visible, which requires two
  # independently-built schemas on one service container — a from-empty replay cannot
  # detect drift against anything if the only database in the job is the one it built.
  # (Provenance, HISTORICAL — do not go looking for this file, it is gone: this job
  # replaces the earlier design that leaned on the since-DELETED
  # `Sonnet/scripts/ci/provision-premigration-schema.js` to SIMULATE a pre-migration schema
  # and replay only the 17 newest migrations. Recoverable from git history if ever needed;
  # see the DECISION marker inside the job below for the full lineage.)
  #
  # What the job does:
  #   1. create a second, throwaway `schema_sync` database on the same service container;
  #   2. PROVE the migration side is empty — zero user relations, zero user enums — BEFORE
  #      anything is replayed into it (88.4-CODE-REVIEW.md #11). Every claim below about
  #      "from EMPTY" rests on this step and no longer on service-container freshness;
  #   3. MIGRATION SIDE — `npx sequelize-cli db:migrate` into `boardgame_db` from EMPTY:
  #      the guarded baseline (migrations/00000000000000-baseline-pre-migration-schema.js)
  #      plus every migration after it. No sync() ever touches this database and
  #      SequelizeMeta is never pre-seeded, so a defect on ANY migration's
  #      table-creation branch surfaces here instead of on Railway;
  #   4. assert every migration filename is booked in SequelizeMeta (no silent skips —
  #      a short replay would otherwise be reported by step 6 as model drift);
  #   5. SYNC SIDE — sequelize.sync() from THIS commit's models into `schema_sync`;
  #   6. diff the two schemas (tables / FKs / PKs / uniques / indexes) minus the
  #      signed-off allowlist. ARMED as of Plan 88.4-09 (D-08) — a finding FAILS this job;
  #   7. baseline no-op proof — run the baseline migration ALONE against the sync-built
  #      database: the exact shape prod sees on the first deploy after this merges.
  migrate-cli-replay:
    # DECISION Phase 88.4 D-05: a REAL from-empty replay of all 77 migration files OVER
    # the retired provision script's SIMULATION of a pre-migration schema (sync-build a
    # base, rewind ~16 migrations, hand-seed SequelizeMeta with the ~53 older filenames,
    # then replay only the 17 newest). This EXTENDS the Phase 87.1 review F8 decision, it
    # does not reverse it: F8 wanted the real CLI + SequelizeMeta path exercised in CI
    # rather than first on Railway, and a from-empty replay covers all 77 files where the
    # simulation covered 17 — strictly more of what F8 asked for. The script existed only
    # because the chain could not book from an empty database, which is exactly the
    # constraint Plan 01's guarded baseline removed (the script's own header said so), so
    # what is retired is the compensating MECHANISM, not the decision. The rekey `down()`
    # replays and populated-row backfills that script also exercised are independently
    # covered by tests/migrations/rekey.test.js in the `test` job, which this design does
    # not touch.
    # ALSO REJECTED: keeping a second, sibling job alongside this one for a soak period.
    # It would rebuild the identical scaffold on every PR and leave TWO required checks
    # asserting the same property, the weaker of which can still green a broken chain.
    # Widening this back to a simulated pre-migration base is a decision, not a cleanup.
    name: migrate-cli-replay
    needs: quality # gate behind the fast grep gate (like `test`); independent of `test`
    runs-on: ubuntu-latest
    # RESEARCH R-10: 32 migrations open their OWN connection via
    # require('../config/database') and none of them calls sequelize.close(), so a hang at
    # the end of db:migrate is a low-probability but real failure mode. A hung job is worse
    # than a failed one — cap it.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: boardgame_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # DB_* are the service container's coordinates (kept for any tool that reads the
      # individual vars rather than a URL).
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: boardgame_db
      # models/index.js reaches models/SingleUseToken.js, which may read this at require
      # time. Throwaway CI-only value — it must merely exist.
      MAGIC_TOKEN_SECRET: ci-throwaway-magic-token-secret-1f2e3d4c5b6a
      # Purpose-named URLs. None of these three is read by the app's connection chain, so
      # they cannot be captured by it (that is the point — see the D-06 note below).
      ADMIN_DB_URL: postgres://postgres:password@localhost:5432/postgres
      MIGRATE_DB_URL: postgres://postgres:password@localhost:5432/boardgame_db
      SYNC_DB_URL: postgres://postgres:password@localhost:5432/schema_sync
      #
      # D-06 — READ BEFORE ADDING ANY env KEY TO THIS JOB.
      # DATABASE_URL is deliberately NOT set at job level. Job-level env is inherited by
      # EVERY step, and this job deliberately points two different steps at two different
      # databases. Both config/database.js:16-19 and config/sequelize-cli.config.js:16-20
      # resolve the SAME chain:
      #     POSTGRES_PRIVATE_URL || POSTGRES_URL || DATABASE_URL || PGDATABASE_URL
      # and 32 of the 76 post-baseline migrations open their own connection through the
      # former. If DATABASE_URL were job-wide and one step overrode it, the CLI would write
      # to one database while those 32 migrations wrote to another, and step 5 would then
      # compare a half-built schema against itself and PASS. So DATABASE_URL is scoped
      # per-step, and the other THREE members of that chain must never be set anywhere in
      # this job:
      #   - POSTGRES_PRIVATE_URL and POSTGRES_URL OUTRANK DATABASE_URL, so either one would
      #     silently redirect the migrate step no matter what the step sets;
      #   - PGDATABASE_URL is the chain's TAIL, so it would capture every step that does NOT
      #     set DATABASE_URL — which is most of them.
      # Setting any of the three is a false-green, not a convenience.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Sonnet/package-lock.json

      - name: Install dependencies
        working-directory: Sonnet
        run: npm ci

      # Each step below restates the URL(s) it needs even when the job-level value is
      # identical. That is deliberate: per D-06 the database a step targets has to be
      # readable from the step itself, not inferred from a job-level default.

      - name: Create the sync-side database
        working-directory: Sonnet
        env:
          ADMIN_DB_URL: ${{ env.ADMIN_DB_URL }}
        # Bare `DROP DATABASE IF EXISTS schema_sync` + `CREATE DATABASE`. It runs FIRST, on
        # a fresh service container, because Postgres refuses the DROP while any session
        # holds a connection to that database. Do not move it after a step that connects
        # to `schema_sync`.
        run: node scripts/ci/create-sync-db.js

      # RUNS IMMEDIATELY BEFORE THE REPLAY, and the adjacency is the point: this step is what
      # makes the words "from EMPTY" in the next step's name true. Before it existed, the
      # from-empty property — the property the entire job is built on — rested on nothing but
      # the freshness of the service container. See the script header for the false-green it
      # closes: a pre-seeded SequelizeMeta makes db:migrate skip, makes
      # verify-migration-chain.js pass anyway, and makes the drift diff compare a schema the
      # migration chain never built. Do not reorder this after the replay; a post-hoc check
      # cannot fire before the database has already been written to.
      - name: Assert the migration side started EMPTY (before any replay)
        working-directory: Sonnet
        env:
          # Purpose-named, NOT DATABASE_URL (D-06): this assert must be impossible to steer
          # onto the sync database, where a pass would be meaningless.
          MIGRATE_DB_URL: ${{ env.MIGRATE_DB_URL }}
        run: node scripts/ci/assert-migrate-db-empty.js

      - name: Migration-side build — baseline + every migration from EMPTY
        working-directory: Sonnet
        env:
          # THE ONLY STEP where DATABASE_URL points at the MIGRATION database, and it must
          # stay that way: the sequelize-cli config AND the 32 self-connecting migrations
          # both resolve it, and they have to land on the same database (D-06).
          DATABASE_URL: ${{ env.MIGRATE_DB_URL }}
        run: npx sequelize-cli db:migrate

      - name: Verify every migration booked in SequelizeMeta
        working-directory: Sonnet
        env:
          MIGRATE_DB_URL: ${{ env.MIGRATE_DB_URL }}
        run: node scripts/ci/verify-migration-chain.js

      - name: Sync-side build — sequelize.sync() from models
        working-directory: Sonnet
        env:
          # Step-scoped to the SYNC database. The script asserts its resolved database name
          # is `schema_sync` before it syncs, so a missing or mis-indented value here fails
          # loudly instead of silently overwriting the migration-built schema.
          DATABASE_URL: ${{ env.SYNC_DB_URL }}
        run: node scripts/ci/sync-build-schema.js

      - name: Schema drift diff
        working-directory: Sonnet
        env:
          MIGRATE_DB_URL: ${{ env.MIGRATE_DB_URL }}
          SYNC_DB_URL: ${{ env.SYNC_DB_URL }}
        # ============================ THE GATE IS ARMED ============================
        # ARMED by Plan 88.4-09 (D-08 flip, SPEC R7). `SCHEMA_DRIFT_REPORT_ONLY` USED TO SIT
        # IN THE env BLOCK ABOVE AND HAS BEEN DELETED. A schema-drift finding now FAILS this
        # job and blocks the PR. There is no report-only mode in backend CI any more.
        #
        # It could be armed because the drift was driven to ZERO first and MEASURED, not
        # predicted: 88.4-DRIFT-CENSUS.md carries all 43 day-one findings, every one of them
        # dispositioned `reconcile` with an owner sign-off dated 2026-07-30 (its § 7), all 43
        # were executed in Plan 08, and CI run 30513558890 then reported 164 vs 164 canonical
        # identities and `[88.4] NO SCHEMA DRIFT` with the allowlist EMPTY. Arming a gate that
        # is already red is the one thing the SPEC forbids.
        #
        # ---- IF THIS STEP IS FAILING YOUR PR, READ THIS BEFORE YOU EDIT THIS FILE ----
        # The ONLY sanctioned way to accept a difference is an entry in
        # scripts/ci/schema-drift-allowlist.js that pins the FULL normalized identity of the
        # object and carries an owner-signed `// DECISION Phase 88.4` marker immediately above
        # it — which the `quality` job's marker gate (scripts/ci/verify-allowlist-markers.js)
        # structurally enforces, per entry, so an unmarked entry cannot merge.
        #
        # RE-ADDING `SCHEMA_DRIFT_REPORT_ONLY: "1"` IS NOT AN OPTION. It is named here because
        # it is the obvious shortcut a developer under CI pressure will reach for, it is a
        # one-line edit, and it silently converts this gate into a job that gates NOTHING while
        # still reporting green — which is strictly worse than never having built it, because
        # everyone downstream believes drift is being caught. The differ still reads the flag
        # (that is deliberate: the mechanism stays testable, and see the D-08 marker in
        # scripts/ci/schema-drift-diff.js), so nothing but this comment stops you. If the drift
        # is genuine, reconcile it or allowlist it with a signature; if the gate is wrong, fix
        # the gate. Disarming it is a decision that belongs to the owner, not to a red PR.
        #
        # Report-only was always an env flag the differ reads rather than a step-level
        # `continue-on-error`, precisely so that arming would be this reviewable one-line
        # deletion AND so that a differ CRASH would fail the step in both modes.
        # `continue-on-error` would have swallowed a genuine crash and made it look identical
        # to a clean pass — do not substitute it for the flag either.
        run: node scripts/ci/schema-drift-diff.js

      - name: Baseline no-op proof — baseline migration only, against the sync-built DB
        working-directory: Sonnet
        env:
          # BOTH point at the SYNC database on purpose: the CLI resolves DATABASE_URL, and
          # the inline SequelizeMeta assertion below reads MIGRATE_DB_URL — here the
          # "migrate side" IS the sync-built database, because that is the database under
          # proof.
          DATABASE_URL: ${{ env.SYNC_DB_URL }}
          MIGRATE_DB_URL: ${{ env.SYNC_DB_URL }}
        # D-02's provisioned-path assertion: the guarded baseline must meet an ALREADY-BUILT
        # schema, take its no-op branch, and still book its filename. That is exactly what
        # the first Railway deploy after this merges will do, and a baseline that hard-fails
        # there blocks the deploy.
        #
        # SCOPED TO THE BASELINE ONLY (--to), NEVER the unscoped `db:migrate`. The
        # sync-built database already contains every modern table, and unguarded historical
        # migrations are guaranteed to collide with it — e.g.
        # migrations/20260107-create-user-availability.js:6 does a bare
        # createTable('UserAvailabilities') that sync() has already created, and
        # migrations/20260108-fix-usergroup-user-id-type.js:9 changeColumn's a
        # `UserGroups.user_id` that the models no longer declare (dropped in 87.5 D-08). A
        # full-chain replay against THIS database can never succeed, so widening this step
        # back out would permanently red the job, not strengthen it.
        #
        # RUNS LAST, AFTER the diff, because it MUTATES the sync side (it books a
        # SequelizeMeta row). Reordering it ahead of the differ would change the schema the
        # differ reads. If that ordering constraint ever becomes impossible, the answer is a
        # THIRD throwaway database, not a reordering.
        #
        # The assertion is baseline-SCOPED on purpose: scripts/ci/verify-migration-chain.js
        # (step 3) expects all 77 filenames booked and would fail here, where exactly one
        # migration ran.
        run: |
          set -o pipefail
          BASELINE=00000000000000-baseline-pre-migration-schema.js
          npx sequelize-cli db:migrate --to "$BASELINE" 2>&1 | tee /tmp/baseline-noop.log
          if ! grep -q 'no-op, booking filename only' /tmp/baseline-noop.log; then
            echo "::error::[88.4-baseline-proof] the baseline did NOT take its no-op branch against the sync-built database. It must detect the existing \"Users\" table and return without executing DDL — otherwise the first Railway deploy after this merges runs CREATE TABLE against a populated production database. Check the existence guard in migrations/$BASELINE."
            exit 1
          fi
          BASELINE_NAME="$BASELINE" node -e '
            const { Client } = require("pg");
            const expected = process.env.BASELINE_NAME;
            const client = new Client({ connectionString: process.env.MIGRATE_DB_URL, connectionTimeoutMillis: 10000 });
            (async () => {
              try {
                await client.connect();
                const { rows } = await client.query("SELECT name FROM \"SequelizeMeta\" ORDER BY name");
                const names = rows.map((r) => r.name);
                if (names.length !== 1 || names[0] !== expected) {
                  console.error("::error::[88.4-baseline-proof] expected EXACTLY one booked migration (" + expected + ") on the sync-built database; SequelizeMeta holds: " + (names.join(", ") || "(none)") + ". A no-op that is not booked would re-run on every deploy; anything else booked means this step was not scoped to the baseline.");
                  process.exitCode = 1;
                  return;
                }
                console.log("[88.4-baseline-proof] OK — baseline no-opped against the already-built schema and booked its filename, nothing else ran.");
              } catch (err) {
                console.error("::error::[88.4-baseline-proof] " + (err && err.message ? err.message : err));
                process.exitCode = 1;
              } finally {
                await client.end().catch(() => {});
              }
            })();
          '
